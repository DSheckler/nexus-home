<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEXUS">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>NEXUS Casa</title>
  <style>
    :root {
      --bg: #f4f4f2; --panel: #ffffff; --line: #e3e3df; --text: #17181b; --muted: #6c7076;
      --sun: #c98a2b; --sun-ink: #1a1408; --danger: #c4483c;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171a; --panel: #1d2024; --line: #2a2e33; --text: #eceae6; --muted: #8b9097; --sun: #e8b86a; --danger: #e07a6e; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
      -webkit-tap-highlight-color: transparent;
    }
    header { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 10px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
    .who { font-size: 15px; color: var(--muted); background: none; border: 0; padding: 4px 0; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--line); padding: 4px; border-radius: 12px; margin: 6px 0 18px; }
    .tabs button { border: 0; border-radius: 9px; padding: 9px; font: inherit; font-weight: 500; background: transparent; color: var(--text); }
    .tabs button[aria-selected="true"] { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .panel { background: var(--panel); border-radius: 16px; overflow: hidden; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
    li:first-child { border-top: 0; }
    .check { width: 26px; height: 26px; flex: none; border: 2px solid var(--muted); border-radius: 8px; background: none; padding: 0; }
    li.done .check { background: var(--sun); border-color: var(--sun); }
    li.done .txt { color: var(--muted); text-decoration: line-through; }
    .txt { flex: 1; min-width: 0; word-wrap: break-word; }
    .meta { display: block; font-size: 13px; color: var(--muted); }
    .del { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px 6px; }
    .empty { padding: 22px 16px; color: var(--muted); text-align: center; }
    form { display: flex; gap: 8px; margin-top: 14px; }
    input, select {
      font: inherit; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0;
    }
    input { flex: 1; }
    input:focus, select:focus { outline: 2px solid var(--sun); outline-offset: 1px; }
    .btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--sun); color: var(--sun-ink); }
    .link { display: block; margin: 14px auto 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 15px; }
    .note-form { flex-direction: column; }
    .note-form .row { display: flex; gap: 8px; }
    .msg { padding: 40px 16px; text-align: center; color: var(--muted); }
    .hidden { display: none !important; }
    .status { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; min-height: 18px; }
  </style>
</head>
<body>
  <header>
    <h1>NEXUS</h1>
    <button class="who" id="who" type="button"></button>
  </header>

  <div id="unpaired" class="msg hidden">
    Este móvil no está vinculado.<br>Abre en Safari el enlace que te pasaron y, desde esa página, usa
    «Compartir → Añadir a pantalla de inicio».<br><br>O pega aquí el enlace o el código:
    <form id="pairForm">
      <input id="pairCode" type="text" placeholder="Enlace o código" aria-label="Enlace o código" autocapitalize="off" autocorrect="off">
      <button class="btn" type="submit">Vincular</button>
    </form>
  </div>

  <main id="app" class="hidden">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabShop" aria-selected="true">Compra</button>
      <button type="button" role="tab" id="tabNotes" aria-selected="false">Notas</button>
    </div>

    <section id="shop">
      <div class="panel"><ul id="shopList"></ul></div>
      <form id="shopForm">
        <input id="shopInput" type="text" maxlength="60" placeholder="Añadir a la lista…" aria-label="Artículo" enterkeyhint="done">
        <button class="btn" type="submit">Añadir</button>
      </form>
      <button class="link" id="clearDone" type="button">Quitar los comprados</button>
    </section>

    <section id="notes" class="hidden">
      <div class="panel"><ul id="noteList"></ul></div>
      <form id="noteForm" class="note-form">
        <div class="row">
          <select id="noteTo" aria-label="Para">
            <option>Todos</option>
          </select>
          <input id="noteText" type="text" maxlength="160" placeholder="Escribe una nota…" aria-label="Nota">
        </div>
        <button class="btn" type="submit">Dejar nota en el panel</button>
      </form>
    </section>
    <p class="status" id="status"></p>
  </main>

  <script>
    (function () {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const store = {
        get: (k) => { try { return localStorage.getItem("nexus.m." + k); } catch { return null; } },
        set: (k, v) => { try { localStorage.setItem("nexus.m." + k, v); } catch { /* sin almacenamiento */ } },
      };

      // Vinculación: el enlace lleva la clave en el fragmento (#k=...), que nunca se envía al servidor.
      // Se deja en la dirección a propósito: en iPhone, el icono de la pantalla de inicio guarda
      // esa dirección y no comparte los datos de Safari, así que la necesita para vincularse solo.
      const m = location.hash.match(/k=([a-f0-9]{32,128})/i);
      if (m) store.set("key", m[1]);
      const key = store.get("key");
      if (!key) {
        $("unpaired").classList.remove("hidden");
        $("pairForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const code = ($("pairCode").value.match(/[a-f0-9]{32,128}/i) || [])[0];
          if (!code) { $("pairCode").value = ""; $("pairCode").placeholder = "Código no válido"; return; }
          location.replace(location.pathname + "#k=" + code);
          location.reload();
        });
        return;
      }
      if (!m) history.replaceState(null, "", location.pathname + "#k=" + key); // el icono siempre lleva su clave
      $("app").classList.remove("hidden");

      // Quién usa este móvil (para firmar las notas)
      let PEOPLE = [];
      function renderWho() { $("who").textContent = store.get("who") ? "Soy " + store.get("who") : "¿Quién eres?"; }
      $("who").addEventListener("click", () => {
        const cur = PEOPLE.indexOf(store.get("who"));
        store.set("who", PEOPLE[(cur + 1) % PEOPLE.length]);
        renderWho();
      });
      renderWho();

      async function api(path, opts = {}) {
        const r = await fetch(path, {
          method: opts.method || "GET",
          headers: { Authorization: "Bearer " + key, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
          body: opts.body ? JSON.stringify(opts.body) : undefined,
          cache: "no-store",
        });
        if (r.status === 401 || r.status === 403) { $("status").textContent = "Este enlace ya no es válido. Pide uno nuevo."; throw new Error("auth"); }
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || "error");
        return j;
      }

      function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

      // ---------- Compra ----------
      function renderShop(items) {
        const ul = $("shopList");
        ul.replaceChildren();
        if (!items.length) { ul.append(el("li", "empty", "La lista está vacía")); return; }
        for (const it of items) {
          const li = el("li", it.done ? "done" : "");
          const chk = el("button", "check"); chk.type = "button"; chk.setAttribute("aria-label", (it.done ? "Desmarcar " : "Marcar ") + it.text);
          chk.addEventListener("click", async () => renderShop((await api("/api/shopping/" + it.id, { method: "PATCH", body: { done: !it.done } })).items));
          li.append(chk, el("span", "txt", it.text));
          ul.append(li);
        }
      }
      $("shopForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const t = $("shopInput").value.trim();
        if (!t) return;
        $("shopInput").value = "";
        renderShop((await api("/api/shopping", { method: "POST", body: { text: t } })).items);
      });
      $("clearDone").addEventListener("click", async () => renderShop((await api("/api/shopping/comprados", { method: "DELETE" })).items));

      // ---------- Notas ----------
      function renderNotes(notes) {
        const ul = $("noteList");
        ul.replaceChildren();
        if (!notes.length) { ul.append(el("li", "empty", "No hay notas en el panel")); return; }
        for (const n of notes.slice().reverse()) {
          const li = el("li");
          const txt = el("span", "txt", n.text);
          txt.append(el("span", "meta", "Para " + n.to + (n.from ? " · de " + n.from : "")));
          const del = el("button", "del", "×"); del.type = "button"; del.setAttribute("aria-label", "Quitar nota");
          del.addEventListener("click", async () => renderNotes((await api("/api/notes/" + n.id, { method: "DELETE" })).notes));
          li.append(txt, del);
          ul.append(li);
        }
      }
      $("noteForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = $("noteText").value.trim();
        if (!text) return;
        $("noteText").value = "";
        renderNotes((await api("/api/notes", { method: "POST", body: { to: $("noteTo").value, text, from: store.get("who") || "" } })).notes);
        $("status").textContent = "Nota enviada al panel";
        setTimeout(() => ($("status").textContent = ""), 2500);
      });

      // ---------- Pestañas y actualización ----------
      function tab(which) {
        const shop = which === "shop";
        $("shop").classList.toggle("hidden", !shop); $("notes").classList.toggle("hidden", shop);
        $("tabShop").setAttribute("aria-selected", String(shop)); $("tabNotes").setAttribute("aria-selected", String(!shop));
        store.set("tab", which);
      }
      $("tabShop").addEventListener("click", () => tab("shop"));
      $("tabNotes").addEventListener("click", () => tab("notes"));
      tab(store.get("tab") || "shop");

      async function load() {
        try {
          const [s, n] = await Promise.all([api("/api/shopping"), api("/api/notes")]);
          renderShop(s.items); renderNotes(n.notes);
        } catch (e) { if (e.message !== "auth") $("status").textContent = "Sin conexión"; }
      }
      // La familia viene de la configuración del servidor
      api("/api/config").then((c) => {
        PEOPLE = c.family || [];
        for (const name of PEOPLE) $("noteTo").append(new Option(name, name));
        renderWho();
      }).catch(() => {});
      load();
      setInterval(() => { if (document.visibilityState === "visible") load(); }, 15000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
    })();
  </script>
</body>
</html>
