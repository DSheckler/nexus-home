<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15171a">
  <title>NEXUS Home</title>
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/cristal.css">
</head>
<body data-sky="day">
  <!-- Cielo animado (js/sky.js): detrás del cristal y una capa suave por delante -->
  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <canvas class="fx2" id="fx2" aria-hidden="true"></canvas>
  <main class="app" id="app">

    <!-- Hora, fecha y próxima alarma -->
    <section class="time-block g">
      <!-- Estado de la tablet: Wi-Fi, batería y avisos de conexión -->
      <div class="topline">
        <span class="dev" id="dev" aria-label="Estado de la tablet"></span>
        <span class="sys" id="sys"><i class="dot"></i><span>Comprobando conexión</span></span>
        <div class="pills top" id="pillsTop" aria-live="polite"></div>
        <span class="abroad-box" id="abroad"></span>
      </div>
      <div class="clock" id="clock">--:--</div>
      <!-- Fecha y próxima alarma en la misma línea: deja toda la fila de abajo para los avisos -->
      <div class="date-row">
        <div class="date" id="date"></div>
        <div class="alarm" id="alarm"></div>
      </div>
      <div class="status-row">
        <div class="pills" id="pills" aria-live="polite"></div>
      </div>
      <div class="vac" id="vac"></div>
      <!-- Solo en modo noche: el tiempo de mañana y la fase de la luna -->
      <div class="night-extra" id="nightExtra" aria-hidden="true"></div>
    </section>

    <!-- Clima, barra del sol (luz, temperatura y actividades de hoy) y agenda en un solo cristal -->
    <aside class="side g">
      <section class="panel weather" id="weather"></section>
      <section class="timeline" id="timeline" aria-label="Luz del sol y actividades de hoy"></section>
      <section class="panel agenda" id="agenda"></section>
    </aside>

    <!-- Tarjetas: notas, compra, luz, plantas -->
    <section class="info" id="info" aria-live="polite"></section>

    <!-- Conversación: ocupa el lugar de la línea del día mientras se habla -->
    <section class="caption g" id="caption" aria-live="polite">
      <p class="cap-user" id="capUser"></p>
      <p class="cap-reply" id="capReply"></p>
      <form class="cap-form" id="capForm" hidden>
        <input class="cap-input" id="capInput" type="text" maxlength="300" placeholder="Escribe una pregunta…" aria-label="Pregunta">
        <button class="btn primary" type="submit">Enviar</button>
      </form>
    </section>

    <!-- Asistente y accesos rápidos -->
    <footer class="bar g">
      <button class="assistant" id="assistant" type="button" aria-label="Hablar con NEXUS">
        <span class="orb" aria-hidden="true"></span>
        <span id="assistantText" class="sr-only">Toca para hablar con NEXUS</span>
      </button>
      <div class="ai-state" id="aiState"></div>
      <button class="icon-btn" id="micBtn" type="button" aria-label="Escucha «Oye NEXUS»" aria-pressed="true"></button>
      <button class="icon-btn" id="keyboardBtn" type="button" aria-label="Escribir al asistente"></button>
      <div class="bar-right">
        <nav class="actions" id="actions"></nav>
      </div>
    </footer>

  </main>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/icons.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/alarms.js"></script>
  <script src="js/mic.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/wake.js"></script>
  <script src="js/home.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/agenda.js"></script>
  <script src="js/cook.js"></script>
  <script src="js/sensor.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sky.js"></script>
</body>
</html>
